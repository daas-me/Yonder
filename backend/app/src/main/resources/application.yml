spring:
  application:
    name: yonder-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    properties:
      "[hibernate.default_schema]": yonder
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: yonder
    default-schema: yonder
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
yonder:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:8443}
  storage:
    provider: ${PHOTO_STORAGE_PROVIDER:local}
    photos-directory: ${PHOTO_STORAGE_DIR:./data/photos}
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:yonder-photos}
  google:
    places-api-key: ${GOOGLE_PLACES_API_KEY:}
